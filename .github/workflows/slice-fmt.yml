name: slice-fmt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"

# See https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-slice-fmt:
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: macos-14
            target: x86_64-apple-darwin
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=x86_64
            bin: slice-fmt
          - os: macos-14
            target: aarch64-apple-darwin
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64
            bin: slice-fmt
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: slice-fmt
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: slice-fmt
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bin: Release/slice-fmt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >
          cmake -S slice-fmt -B slice-fmt/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build slice-fmt/build --config Release

      - name: Upload slice-fmt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slice-fmt_${{ matrix.target }}
          path: ./slice-fmt/build/${{ matrix.bin }}
          if-no-files-found: error
